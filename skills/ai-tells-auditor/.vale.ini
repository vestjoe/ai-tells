StylesPath = styles
MinAlertLevel = suggestion

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, \
  https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip, \
  https://github.com/vale-cli/write-good/releases/download/v0.4.1/write-good.zip, \
  https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip, \
  https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip

[*.{md,txt}]
BasedOnStyles = Custom, ai-tells, proselint, write-good, Microsoft, Google

# Turned off 2026-11-04, from hits sampled on the 2019 Rust Book.
# Every "is" and "are"; nothing to act on.
write-good.E-Prime = NO
# Same spans as Custom.Passive.
write-good.Passive = NO
Google.Passive = NO
Microsoft.Passive = NO
# Flags "implement", the precise term in technical writing.
ai-tells.FormalRegister = NO
# Duplicates Google.Colons; hits were figure captions.
ai-tells.ColonUsage = NO
# "Verify your use of" a word, with no reason given.
Microsoft.Vocab = NO
# Same spans as Custom.EmDash.
ai-tells.EmDashUsage = NO
# First-person plural is the writer's voice choice; off by decision.
Google.We = NO
Microsoft.We = NO
# Same spans and advice as the Microsoft rule, which stays on.
Google.Headings = NO
Google.Contractions = NO
Google.Semicolons = NO
Google.Exclamation = NO
Google.FirstPerson = NO
Google.OxfordComma = NO
# Flags precise terms ("modify", "multiple", "implement"); off by decision.
write-good.TooWordy = NO
