<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">How the ai-tells skills work together</title>
<desc id="desc">Notes go to the writer, which makes a draft. That draft, or a draft you already have, goes to the auditor, which runs Vale and then Claude and writes a ranked report. The editor applies the fixes and checks that no new facts were added, producing the final draft. A voice built from your writing feeds all three skills, and all three read one shared rules file, standard.md.</desc>
<style>.t{fill:#1f2328} .m{fill:#59636e}</style>
